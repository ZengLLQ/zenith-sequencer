name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Go Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Check Formatting
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Executable
        run: go build -v ./cmd/zenith
